[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseticDataAnalysis"
version = "1.1.3"
description = "Posetic Data Analysis — build and analyse partially ordered sets (native C++20 core, no third-party runtime dependencies)."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Avellone" },
    { name = "Lucio De Capitani" },
    { name = "Marco Fattore" },
]
maintainers = [
    { name = "Alessandro Avellone", email = "alessandro.avellone@unimib.it" },
]
keywords = ["poset", "partial order", "linear extensions", "mutual ranking probability", "multi-criteria"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://cran.r-project.org/package=poseticDataAnalysis"
"Source (R package)" = "https://cran.r-project.org/package=poseticDataAnalysis"

[tool.setuptools]
packages = ["poseticDataAnalysis"]
# The C/C++ extension is declared in setup.py (Extension), which pyproject
# metadata alone cannot express.
