name: Build and Publish (Python)

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# The package lives in the python/ subfolder of the monorepo.
defaults:
  run:
    working-directory: python

jobs:
  # ----------------------------------------------------------------
  # Job 1: build wheels for all platforms.
  # The C++20 core uses std::jthread and std::format, so recent
  # toolchains are required: gcc-toolset-13 on Linux, Homebrew LLVM on
  # macOS, MSVC 2022 on Windows.
  # ----------------------------------------------------------------
  build_wheels:
    name: Build wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU to cross-build Linux ARM64 (aarch64) wheels.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.0
        with:
          package-dir: python
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Linux aarch64 is intentionally NOT built here: under QEMU emulation
          # this C++20 project takes 1-2h per release. ARM Linux users install
          # from the sdist. (A native ARM runner can be added later if wanted.)
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"

          # Linux: GCC 13 for <format> / std::jthread and C++20.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++
          CIBW_ENVIRONMENT_LINUX: >
            PATH="/opt/rh/gcc-toolset-13/root/usr/bin:$PATH"
            CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
            CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            LD_LIBRARY_PATH="/opt/rh/gcc-toolset-13/root/usr/lib64:$LD_LIBRARY_PATH"

          # macOS: Homebrew LLVM for a libc++ with std::jthread / std::format.
          CIBW_BEFORE_ALL_MACOS: "brew install llvm"
          CIBW_ENVIRONMENT_MACOS: >
            LLVM_PATH=$(brew --prefix llvm)
            PATH="$LLVM_PATH/bin:$PATH"
            CC="$LLVM_PATH/bin/clang"
            CXX="$LLVM_PATH/bin/clang++"
            MACOSX_DEPLOYMENT_TARGET="14.0"

          # Each freshly built wheel must pass the dependency-free test suite.
          # {package} is the package dir passed to cibuildwheel (python/);
          # {project} is the repo root, where tests/ does NOT live.
          CIBW_TEST_COMMAND: >
            python {package}/tests/test_smoke.py &&
            python {package}/tests/test_phase2.py &&
            python {package}/tests/test_phase3.py &&
            python {package}/tests/test_phase3b.py &&
            python {package}/tests/test_cran_api.py

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ----------------------------------------------------------------
  # Job 2: build the source distribution (sdist).
  # ----------------------------------------------------------------
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # ----------------------------------------------------------------
  # Job 3a: publish to TestPyPI (wheels + sdist), on v* tags only.
  # Trusted Publishing (OIDC): no API token to manage — configure a
  # pending publisher on test.pypi.org (owner: aavellone,
  # repo: PoseticDataAnalysis, workflow: build.yml, environment: empty).
  # ----------------------------------------------------------------
  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  # ----------------------------------------------------------------
  # Job 3b: publish to the real PyPI (wheels + sdist), on v* tags only.
  #
  # MANUAL APPROVAL: this job runs in the protected `pypi` environment,
  # so it PAUSES on every tag and waits for your click in the GitHub UI
  # (Actions run -> "Review deployments" -> Approve) before uploading.
  # Set it up once: repo Settings -> Environments -> New environment
  # "pypi" -> add yourself under "Required reviewers".
  #
  # Trusted Publishing (OIDC): configure a pending publisher on pypi.org
  # with owner: aavellone, repo: PoseticDataAnalysis, workflow: build.yml,
  # and Environment name: pypi (MUST match the environment below).
  # ----------------------------------------------------------------
  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/poseticDataAnalysis/
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
